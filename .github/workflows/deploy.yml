name: Build and Deploy Pill by Pill

on:
  push:
    branches: ["main"]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply v6.2 Unified Release & Build Site
        run: |
          python3 - << 'EOF'
          import importlib.util, pathlib, subprocess, sys, tempfile

          # Hotfix v6.0g anchor name (_marketplace_links -> _market_links)
          p_60g = pathlib.Path("patches/2026-11-21_v6.0g_equipment_expansion_18_classes_patch.py")
          if p_60g.is_file():
              txt = p_60g.read_text(encoding="utf-8")
              if "_marketplace_links" in txt:
                  p_60g.write_text(txt.replace("_marketplace_links", "_market_links"), encoding="utf-8")

          spec = importlib.util.spec_from_file_location("v52", "patches/2026-11-24_apply_v6.2_unified_release_v52.py")
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          with tempfile.TemporaryDirectory() as td:
              tree = mod._unpack_clean(pathlib.Path("patches/2026-11-21_pill-by-pill-source_v6.0b.zip"), pathlib.Path(td) / "tree")
              try:
                  mod.integrate_v62(tree, pathlib.Path("patches"))
                  mod._pack_clean(tree, pathlib.Path("/tmp/pill-by-pill-v6.2.zip"))
              except subprocess.CalledProcessError as e:
                  print("=== FAILED CMD ===", e.cmd)
                  print("=== STDOUT ===\n", e.stdout)
                  print("=== STDERR ===\n", e.stderr)
                  sys.exit(1)
          EOF
          unzip -q /tmp/pill-by-pill-v6.2.zip -d /tmp/build
          touch /tmp/build/site/.nojekyll

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/build/site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
